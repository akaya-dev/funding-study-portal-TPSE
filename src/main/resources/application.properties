spring.application.name=student-funding-portal

# The signed declaration PDF may be up to 10MB (Spring's default limit is 1MB)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB

# Where submissions are stored (relative to the directory the app is started from)
portal.submissions-file=submissions.txt
portal.uploads-dir=uploads
